# TA3 - Mosquitto (prototipo academico, sin contenedores)
# Windows: copiar a "C:\Program Files\mosquitto\mosquitto.conf" y ejecutar:
#   mosquitto -c mosquitto.conf -v
# Linux:   sudo cp mosquitto.conf /etc/mosquitto/conf.d/ta3.conf && sudo systemctl restart mosquitto

listener 1883
allow_anonymous true

# --- Version con autenticacion (recomendada para evolucion productiva) ---
# allow_anonymous false
# password_file C:\mosquitto\passwd        (crear con: mosquitto_passwd -c passwd usuario)
# acl_file C:\mosquitto\acl

persistence true
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
