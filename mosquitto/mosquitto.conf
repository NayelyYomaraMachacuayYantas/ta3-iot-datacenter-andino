# ===== Mosquitto local - TA3 DataCenter Andino =====
# Iniciar:  mosquitto -c mosquitto.conf -v
# Las opciones globales van ANTES del bloque "connection".

# --- Broker local ---
listener 1883
allow_anonymous true          # solo prototipo academico; en produccion usar usuarios/ACL y TLS (8883)
persistence true
persistence_file mosquitto.db

# --- Puente hacia el broker publico (opcion D del README) ---
# El ESP32 (Wokwi) publica en broker.emqx.io con el prefijo dcandino_nayely_7342/.
# El puente "trae" esos mensajes al broker local con el prefijo dcandino/,
# que es el que escucha Node-RED:
#   remoto: dcandino_nayely_7342/sala01/telemetria  ->  local: dcandino/sala01/telemetria
#   remoto: dcandino_nayely_7342/sala01/estado      ->  local: dcandino/sala01/estado
connection puente_publico
address broker.emqx.io:1883
remote_clientid dcandino_nayely_puente
try_private false
bridge_protocol_version mqttv311
topic sala01/# in 1 dcandino/ dcandino_nayely_7342/
cleansession true
